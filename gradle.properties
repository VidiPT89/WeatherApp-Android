# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# WeatherApp Google Cloud project's Web OAuth client id -- Android's Credential Manager /
# Sign in with Google needs the *Web* client id here (as the "server client id" whose audience
# the backend verifies), not an Android-specific one. Reusing the existing Web client id from
# console.cloud.google.com/auth/clients still requires an *Android*-type OAuth client (package
# name dev.ividi.weatherapp + signing SHA-1) to also exist in that same project for Google Play
# Services to authorize requests from this app -- that registration itself isn't referenced here.
GOOGLE_WEB_CLIENT_ID=
